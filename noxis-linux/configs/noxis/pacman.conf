#
# /etc/pacman.conf for the *build host* (mkarchiso)
#
# NoxisOS builds on top of two repository sets:
#   1. the official Arch Linux repositories (core / extra / multilib)
#   2. the CachyOS repositories, which ship the optimized packages, the
#      linux-cachyos kernels, chwd, cachyos-settings and the installer.
#
# The CachyOS repositories must come *first* so their packages win when a
# name exists in both trees.
#
# NOTE: the Arch mirrors come from the *build host* (/etc/pacman.d/mirrorlist,
# i.e. `/usr/share/pacman/defaults/mirrorlist` inside the CI container), while
# the CachyOS mirrors are pinned here on purpose.
#
[options]
HoldPkg      = pacman glibc
Architecture = auto
Color
ILoveCandy
VerbosePkgLists
DisableDownloadTimeout
ParallelDownloads = 10
# We cannot check disk space from inside a chroot environment
#CheckSpace
DisableSandbox

SigLevel            = Required DatabaseOptional
LocalFileSigLevel   = Optional

# --- CachyOS optimised repositories ---------------------------------------
# Switch to [cachyos-v3] / [cachyos-v4] / [cachyos-znver4] to build an ISO
# that requires those CPU levels (scripts/switch-repo-tier.sh does it for you).
[cachyos]
Server = https://mirror.cachyos.org/repo/$arch/$repo

# --- Arch Linux ----------------------------------------------------------
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
