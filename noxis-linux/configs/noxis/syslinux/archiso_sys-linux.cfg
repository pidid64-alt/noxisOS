LABEL noxis
TEXT HELP
Boot NoxisOS Cachy Edition (Hyprland live session).
Install it to your disk, or use it for maintenance and rescue.
ENDTEXT
MENU LABEL NoxisOS Cachy Edition (%ARCH%, linux-cachyos)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL noxislts
TEXT HELP
Boot NoxisOS Cachy Edition with the LTS kernel (linux-cachyos-lts).
Use this if the default kernel misbehaves on your hardware.
ENDTEXT
MENU LABEL NoxisOS Cachy Edition (%ARCH%, ^LTS kernel)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL noxissafe
TEXT HELP
Boot NoxisOS Cachy Edition with basic (VESA) graphics and nomodeset.
ENDTEXT
MENU LABEL NoxisOS Cachy Edition (%ARCH%, ^safe graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%
