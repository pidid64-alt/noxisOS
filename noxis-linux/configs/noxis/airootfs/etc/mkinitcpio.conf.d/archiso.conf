# Live-medium initramfs hooks (archiso). The installer deletes this file in the
# target system so the installed initramfs is built with the normal Arch hooks.
# plymouth draws the paws splash while the live medium is found.
HOOKS=(base udev microcode modconf kms plymouth memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 --long=27)
