# SDDM is *not* used on the live medium (that boots straight into Hyprland on
# tty1); the installer enables it on the installed system.
[General]
DisplayServer=x11
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot

[Theme]
# Set "Current=" to any theme in /usr/share/sddm/themes (install
# e.g. `breeze` or `sddm-theme-*` for something fancier).
Current=
CursorTheme=Adwaita

[Users]
MaximumUid=60000
MinimumUid=1000
