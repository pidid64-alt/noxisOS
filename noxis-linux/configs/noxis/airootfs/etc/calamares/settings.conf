# ===========================================================================
#  NoxisOS Cachy Edition — Calamares settings
# ===========================================================================
# The installer runs on the NoxisOS live medium, where the whole target system
# already exists inside the ISO. That makes the install *offline capable*:
# `unpackfs` copies the live rootfs (which is the installed system) onto the
# target disk, and two shellprocess jobs strip and re-brand the result.
# ===========================================================================
---
modules-search: [ local ]

instances:
- id:       prepare
  module:   shellprocess
  config:   noxis-prepare.conf
- id:       finalize
  module:   shellprocess
  config:   noxis-finalize.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - removeuser
  - users
  - networkcfg
  - displaymanager
  - hwclock
  - shellprocess@prepare
  - initcpiocfg
  - initcpio
  - bootloader
  - grubcfg
  - services-systemd
  - shellprocess@finalize
  - preservefiles
  - umount
- show:
  - finished

branding: noxis

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
