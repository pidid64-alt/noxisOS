# ===========================================================================
#  NoxisOS Cachy Edition — Calamares settings
# ===========================================================================
# The installer runs on the NoxisOS live medium, where the whole target system
# already exists inside the ISO. That makes the install *offline capable*:
# `unpackfs` copies the live rootfs (which is the installed system) onto the
# target disk, and two shellprocess jobs strip and re-brand the result.
#
# NOTE ON FILE NAMES: the `noxis-calamares` package owns the stock
# /etc/calamares/modules/<module>.conf files, and archiso copies airootfs
# *before* installing packages — shipping files with the same names would abort
# the build with "exists in filesystem". Every configuration we override
# therefore lives in `noxis-<module>.conf` and is bound to its module through
# an instance below (the same trick CachyOS uses for welcome_online.conf).
# ===========================================================================
---
modules-search: [ local ]

instances:
# ---- shellprocess workers (the module has no stock config of its own) ------
- id: prepare
  module: shellprocess
  config: noxis-prepare.conf
- id: finalize
  module: shellprocess
  config: noxis-finalize.conf

# ---- job/view modules we override -----------------------------------------
- id: welcome-noxis
  module: welcome
  config: noxis-welcome.conf
- id: partition-noxis
  module: partition
  config: noxis-partition.conf
- id: users-noxis
  module: users
  config: noxis-users.conf
- id: unpackfs-noxis
  module: unpackfs
  config: noxis-unpackfs.conf
- id: mount-noxis
  module: mount
  config: noxis-mount.conf
- id: fstab-noxis
  module: fstab
  config: noxis-fstab.conf
- id: machineid-noxis
  module: machineid
  config: noxis-machineid.conf
- id: displaymanager-noxis
  module: displaymanager
  config: noxis-displaymanager.conf
- id: bootloader-noxis
  module: bootloader
  config: noxis-bootloader.conf
- id: grubcfg-noxis
  module: grubcfg
  config: noxis-grubcfg.conf
- id: initcpio-noxis
  module: initcpio
  config: noxis-initcpio.conf
- id: services-noxis
  module: services-systemd
  config: noxis-services-systemd.conf
- id: removeuser-noxis
  module: removeuser
  config: noxis-removeuser.conf
- id: preservefiles-noxis
  module: preservefiles
  config: noxis-preservefiles.conf
- id: finished-noxis
  module: finished
  config: noxis-finished.conf

sequence:
- show:
  - welcome@welcome-noxis
  - locale
  - keyboard
  - partition@partition-noxis
  - users@users-noxis
  - summary
- exec:
  - partition@partition-noxis
  - mount@mount-noxis
  - unpackfs@unpackfs-noxis
  - machineid@machineid-noxis
  - fstab@fstab-noxis
  - locale
  - keyboard
  - localecfg
  - removeuser@removeuser-noxis
  - users@users-noxis
  - networkcfg
  - displaymanager@displaymanager-noxis
  - hwclock
  - shellprocess@prepare
  - initcpiocfg
  - initcpio@initcpio-noxis
  - bootloader@bootloader-noxis
  - grubcfg@grubcfg-noxis
  - services-systemd@services-noxis
  - shellprocess@finalize
  - preservefiles@preservefiles-noxis
  - umount
- show:
  - finished@finished-noxis

branding: noxis

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
