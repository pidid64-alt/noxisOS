---
# The live user is called `liveuser`; it is removed from the installed system
# by the removeuser module, so it may not be chosen as the target's user name.
defaultGroups:
    - wheel
    - rfkill
    - sys
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - audio
    - input
    - power
    - optical

doAutologin:     false
sudoersGroup:    wheel
setRootPassword: true
doReusePassword: true

passwordRequirements:
    minLength: 4
allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    forbidden_names: [ root, liveuser ]

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "noxis-${cpu}"
    forbidden_names: [ localhost ]

presets:
    fullName:
        editable: true
    loginName:
        editable: true
