---
# No internet connection is required: everything ships in the ISO.
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
    requiredStorage:    10.0
    requiredRam:        2.0
    internetCheckUrl:   https://archlinux.cachyos.org/
    check:
        - storage
        - ram
        - power
        - root
        - screen
    required:
        - ram
