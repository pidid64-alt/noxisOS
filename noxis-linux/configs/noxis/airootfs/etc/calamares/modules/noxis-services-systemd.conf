---
units:
   - name: "NetworkManager"
     action: "enable"
     mandatory: false
   - name: "bluetooth"
     action: "enable"
     mandatory: false
   - name: "cups"
     action: "enable"
     mandatory: false
   - name: "systemd-timesyncd"
     action: "enable"
     mandatory: false
   - name: "power-profiles-daemon"
     action: "enable"
     mandatory: false
   - name: "fstrim.timer"
     action: "enable"
     mandatory: false
   - name: "sddm"
     action: "enable"
     mandatory: true
   - name: "dhcpcd"
     action: "disable"
     mandatory: false
   - name: "systemd-networkd"
     action: "disable"
     mandatory: false
   - name: "pacman-init"
     action: "disable"
     mandatory: false
