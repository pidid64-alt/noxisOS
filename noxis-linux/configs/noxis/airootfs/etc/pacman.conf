#
# /etc/pacman.conf — NoxisOS Cachy Edition
#
# Arch Linux core/extra/multilib + the CachyOS repositories. The CachyOS repos
# come first so their optimized builds win over the plain Arch packages.
#
# Repository tiers (x86-64 / v3 / v4 / znver4) are marked with
# #<noxis-tier-...> blocks and toggled by the `noxis-repo-tier` tool.
#
[options]
HoldPkg      = pacman glibc
Architecture = auto
Color
ILoveCandy
VerbosePkgLists
DisableDownloadTimeout
ParallelDownloads = 10
CheckSpace
SigLevel            = Required DatabaseOptional
LocalFileSigLevel   = Optional

# --- CachyOS x86-64-v3 optimized packages (Haswell/Excavator and newer) -----
#<noxis-tier-v3>
#[cachyos-v3]
#Include = /etc/pacman.d/cachyos-v3-mirrorlist
#[cachyos-core-v3]
#Include = /etc/pacman.d/cachyos-v3-mirrorlist
#[cachyos-extra-v3]
#Include = /etc/pacman.d/cachyos-v3-mirrorlist
#</noxis-tier-v3>

# --- CachyOS x86-64-v4 optimized packages (AVX-512) ------------------------
#<noxis-tier-v4>
#[cachyos-v4]
#Include = /etc/pacman.d/cachyos-v4-mirrorlist
#[cachyos-core-v4]
#Include = /etc/pacman.d/cachyos-v4-mirrorlist
#[cachyos-extra-v4]
#Include = /etc/pacman.d/cachyos-v4-mirrorlist
#</noxis-tier-v4>

# --- CachyOS Zen 4 / Zen 5 optimized packages ------------------------------
#<noxis-tier-znver4>
#[cachyos-znver4]
#Include = /etc/pacman.d/cachyos-v4-mirrorlist
#[cachyos-core-znver4]
#Include = /etc/pacman.d/cachyos-v4-mirrorlist
#[cachyos-extra-znver4]
#Include = /etc/pacman.d/cachyos-v4-mirrorlist
#</noxis-tier-znver4>

# --- CachyOS extra packages ------------------------------------------------
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# --- Arch Linux ------------------------------------------------------------
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
