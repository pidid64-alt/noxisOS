# ===========================================================================
#  noxis-linux — Hyprland configuration
#  NoxisOS Cachy Edition
# ===========================================================================
#  Docs: https://wiki.hypr.land/Configuring/
#  Edit live with:  hyprctl keyword <option> <value>
# ===========================================================================

$mod           = SUPER
$terminal      = kitty
$fileManager   = dolphin
$browser       = firefox
$menu          = wofi --show drun --allow-images
$editor        = nvim
$wallpaper     = /usr/share/backgrounds/noxis/noxis-wallpaper.png

# ----------------------------------------------------------------- programs --
exec-once = waybar
exec-once = hyprpaper
exec-once = mako
exec-once = hypridle
exec-once = /usr/lib/polkit-kde-authentication-agent-1   # one polkit agent, KDE's
exec-once = xhost +si:localuser:root                     # root GUI apps (installer, gparted)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ---------------------------------------------------------------- monitors --
# Prefer the highest supported mode and let Hyprland scale it sensibly.
monitor = , preferred, auto, auto
# Examples:
# monitor = DP-1, 2560x1440@165, 0x0, 1
# monitor = HDMI-A-1, 1920x1080@60, 2560x0, 1

# ------------------------------------------------------------ environment --
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1
env = XDG_SESSION_TYPE,wayland

# --------------------------------------------------------------- aesthetics --
general {
    gaps_in         = 5
    gaps_out        = 12
    border_size     = 2
    col.active_border   = rgba(8b5cf6ff) rgba(22d3eeff) 45deg
    col.inactive_border = rgba(3f3f46aa)
    resize_on_border    = true
    allow_tearing       = false
    layout              = dwindle
}

decoration {
    rounding           = 12
    rounding_power     = 2
    active_opacity     = 1.0
    inactive_opacity   = 0.97
    fullscreen_opacity = 1.0

    shadow {
        enabled      = true
        range        = 20
        render_power = 3
        color        = rgba(00000080)
    }

    blur {
        enabled           = true
        size              = 6
        passes            = 3
        new_optimizations = true
        xray              = true
        ignore_opacity    = true
        noise             = 0.02
        contrast          = 1.05
        brightness        = 0.95
    }
}

animations {
    enabled = true

    bezier = noxis,    0.05, 0.9, 0.1, 1.0
    bezier = overshot, 0.13, 0.99, 0.29, 1.05
    bezier = smooth,   0.25, 0.46, 0.45, 0.94

    animation = global,       1, 6,  default
    animation = border,       1, 8,  noxis
    animation = windows,      1, 5,  overshot, popin 85%
    animation = windowsOut,   1, 5,  noxis, popin 85%
    animation = windowsMove,  1, 5,  noxis
    animation = fade,         1, 6,  smooth
    animation = fadeOut,      1, 5,  smooth
    animation = layers,       1, 5,  overshot, slide
    animation = layersOut,    1, 4,  noxis, slide
    animation = workspaces,   1, 6,  noxis, slidevert
    animation = specialWorkspace, 1, 6, noxis, slidefadevert 25%
}

misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    force_default_wallpaper  = 0
    vrr                      = 0
    focus_on_activate        = true
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
    animate_manual_resizes   = false
    animate_mouse_windowdragging = false
    enable_swallow           = false
    initial_workspace_tracking = 1
}

binds {
    workspace_back_and_forth = true
    allow_workspace_cycles   = true
}

xwayland {
    force_zero_scaling = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# ------------------------------------------------------------------ input --
input {
    kb_layout  = us,ru
    kb_variant =
    kb_model   =
    kb_options = grp:alt_shift_toggle, grp_led:scroll
    kb_rules   =

    follow_mouse = 1
    sensitivity  = 0
    numlock_by_default = true
    repeat_delay = 300
    repeat_rate  = 40

    touchpad {
        natural_scroll    = true
        disable_while_typing = true
        tap-to-click      = true
        clickfinger_behavior = false
        scroll_factor     = 1.0
    }

    tablet {
        left_handed = false
    }
}

gestures {
    # touchpad workspace swiping is always on in current Hyprland; the old
    # "workspace_swipe" / "workspace_swipe_fingers" switches no longer exist.
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.3
    workspace_swipe_create_new = true
}

# --------------------------------------------------------------- keybinds --
# applications
bind = $mod,       Return, exec, $terminal
bind = $mod SHIFT, Return, exec, $terminal --class noxis-scratch -e tmux new -As main
bind = $mod,       D,      exec, $menu
bind = $mod,       E,      exec, $fileManager
bind = $mod,       B,      exec, $browser
bind = $mod,       W,      exec, $terminal --class noxis-welcome -e /usr/local/bin/noxis-welcome
bind = $mod,       I,      exec, pkexec /usr/local/bin/noxis-run-as-root calamares -d
bind = $mod SHIFT, E,      exec, $terminal -e $editor
bind = $mod,       N,      exec, nm-connection-editor

# window management
bind = $mod,       Q,      killactive
bind = $mod,       F,      fullscreen, 1
bind = $mod SHIFT, F,      fullscreen, 0
bind = $mod,       Space,  togglefloating
bind = $mod SHIFT, Space,  pin
bind = $mod,       J,      layoutmsg, togglesplit
bind = $mod,       P,      pseudo
bind = $mod,       G,      togglegroup
bind = $mod SHIFT, G,      changegroupactive, f
bind = $mod SHIFT, T,      exec, hyprctl dispatch togglefloating && hyprctl dispatch resizeactive exact 70% 70% && hyprctl dispatch centerwindow

# focus
bind = $mod,       left,   movefocus, l
bind = $mod,       right,  movefocus, r
bind = $mod,       up,     movefocus, u
bind = $mod,       down,   movefocus, d
bind = ALT,        Tab,    cyclenext
bind = ALT,        Tab,    bringactivetotop

# move windows
bind = $mod SHIFT, left,   movewindow, l
bind = $mod SHIFT, right,  movewindow, r
bind = $mod SHIFT, up,     movewindow, u
bind = $mod SHIFT, down,   movewindow, d

# resize windows
binde = $mod CTRL, left,   resizeactive, -40 0
binde = $mod CTRL, right,  resizeactive,  40 0
binde = $mod CTRL, up,     resizeactive, 0 -40
binde = $mod CTRL, down,   resizeactive, 0  40

# workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod,       mouse_down, workspace, e+1
bind = $mod,       mouse_up,   workspace, e-1
bind = $mod,       Tab,        workspace, previous

# scratchpad (special workspace)
bind = $mod,       S,      togglespecialworkspace, magic
bind = $mod SHIFT, S,      movetoworkspace, special:magic

# session
bind = $mod,       M,      exec, wlogout -b 4 -c 8 -r 8 -p layer-shell
bind = $mod SHIFT, L,      exec, hyprlock
bind = $mod SHIFT, Q,      exit
bind = $mod SHIFT, M,      exec, systemctl reboot
bind = $mod CTRL,  Q,      killactive

# screenshots (grim + slurp + cliphist)
bind = $mod,       Print,  exec, grim -g "$(slurp)" - | wl-copy && wl-paste -t image/png > /dev/null
bind = $mod SHIFT, Print,  exec, grim - | wl-copy && wl-paste -t image/png > /dev/null
bind = CTRL,       Print,  exec, grim -g "$(slurp)" - | swappy -f -
bind = $mod,       A,      exec, grim -g "$(slurp)" - | swappy -f -

# clipboard history
bind = $mod,       V,      exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mod SHIFT, V,      exec, cliphist wipe

# multimedia / hardware keys
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindel = , XF86AudioMute,        exec, pamixer -t
bindel = , XF86AudioMicMute,     exec, pamixer --default-source -t
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPrev,  exec, playerctl previous
bindl  = , XF86AudioStop,  exec, playerctl stop
bindl  = , XF86Bluetooth,  exec, blueman-manager

# ------------------------------------------------------------------ rules --
# Rules use the current unified syntax:  windowrule = <effect> <value>, match:<prop> <regex>
windowrule = float on,                  match:class ^(pavucontrol)$
windowrule = float on,                  match:class ^(blueman-manager)$
windowrule = float on,                  match:class ^(nm-connection-editor)$
windowrule = float on,                  match:class ^(org.pulseaudio.pavucontrol)$
windowrule = float on,                  match:class ^(gnome-calculator)$
windowrule = float on,                  match:class ^(nwg-look)$
windowrule = float on,                  match:class ^(qt5ct|qt6ct)$
windowrule = float on,                  match:title ^(Picture-in-Picture)$
windowrule = float on,                  match:class ^(xdg-desktop-portal-gtk)$
windowrule = float on,                  match:class ^(org.gnome.FileRoller)$
windowrule = float on,                  match:initial_title ^(Open File|Open Folder|Save File)$
windowrule = float on,                  match:class ^(gparted)$
windowrule = size 1000 620,             match:class ^(pavucontrol|blueman-manager|nm-connection-editor|nwg-look|qt5ct|qt6ct)$
windowrule = center on,                 match:class ^(pavucontrol|blueman-manager|nm-connection-editor|gnome-calculator|nwg-look|qt5ct|qt6ct)$
windowrule = idle_inhibit fullscreen,   match:class ^(firefox|mpv|imv)$
windowrule = suppress_event maximize,   match:class .*
windowrule = workspace special:magic,   match:class ^(noxis-scratch)$
windowrule = float on,                  match:class ^(noxis-welcome)$
windowrule = center on,                 match:class ^(noxis-welcome)$

layerrule = blur on,         match:namespace ^(waybar)$
layerrule = ignore_alpha 0.3, match:namespace ^(waybar)$
layerrule = blur on,         match:namespace ^(wofi)$
layerrule = xray on,         match:namespace ^(wofi)$
layerrule = blur on,         match:namespace ^(mako|notifications)$
layerrule = ignore_alpha 0.2, match:namespace ^(notifications)$
layerrule = blur on,         match:namespace ^(logout_dialog)$
