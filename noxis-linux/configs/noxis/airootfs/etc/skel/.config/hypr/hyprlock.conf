# noxis-linux — lock screen
background {
    monitor =
    path = /usr/share/backgrounds/noxis/noxis-wallpaper.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    contrast = 1.0
    vibrancy = 0.2
}

# clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 0.92)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(210, 200, 255, 0.75)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.25
    outer_color = rgba(139, 92, 246, 0.9)
    inner_color = rgba(15, 15, 25, 0.75)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text = <i>password</i>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = NoxisOS Cachy Edition
    color = rgba(139, 92, 246, 0.85)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -140
    halign = center
    valign = center
}
