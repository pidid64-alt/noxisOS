# noxis-linux — idle behaviour
general {
    lock_cmd = pidof hyprlock || hyprlock       # lock screen
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn display back on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 300                                # 5 min: dim + lock
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

listener {
    timeout = 360                                # 6 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600                                # 10 min: screen off
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

listener {
    timeout = 1800                               # 30 min: suspend
    on-timeout = systemctl suspend
}
