# noxis-linux — kitty terminal
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
cursor_shape     block
cursor_blink_interval 0.5
scrollback_lines 20000
mouse_hide_wait  3.0
enable_audio_bell no
window_padding_width 12
confirm_os_window_close 0
background_opacity 0.94
dynamic_background_opacity yes
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title[:26]}"
active_tab_background   #8b5cf6
active_tab_foreground   #0b0b12
inactive_tab_background #1e1e2e
inactive_tab_foreground #a1a1aa
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+left  previous_tab
map ctrl+shift+right next_tab
map ctrl+shift+q     close_window
map ctrl+shift+z     toggle_layout stack

# noxis palette
foreground            #e5e7eb
background            #0e0e18
selection_foreground  #0b0b12
selection_background  #8b5cf6
cursor                #22d3ee
cursor_text_color     #0e0e18
url_color             #22d3ee
active_border_color   #8b5cf6
inactive_border_color #1e1e2e

